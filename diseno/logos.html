<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>Centauros BMX Race · propuestas de logo</title>
<style>
body{margin:0;background:#0d0e10;font-family:"Barlow Condensed",sans-serif;color:#F6F4EF;width:1600px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:0}
.cell{height:520px;display:grid;place-items:center;position:relative}
.d{background:#151618}.l{background:#F3F1EC}
.tag{position:absolute;left:28px;top:22px;font:800 italic 26px/1 "Barlow Condensed";text-transform:uppercase;letter-spacing:.02em}
.d .tag{color:#C47A3E}.l .tag{color:#8E5226}
</style></head><body>

<svg width="0" height="0" style="position:absolute">
 <defs>
  <!-- A: centauro = corredor + bici -->

   <path d="M84 112 C66 116 54 126 48 140" fill="none" stroke="#C47A3E" stroke-width="5" stroke-linecap="round"/>
   <circle cx="58" cy="150" r="30" fill="none" stroke="currentColor" stroke-width="11"/>
   <circle cx="156" cy="150" r="30" fill="none" stroke="currentColor" stroke-width="11"/>
   <circle cx="58" cy="150" r="5" fill="currentColor"/><circle cx="156" cy="150" r="5" fill="currentColor"/>
   <path d="M58 150 L100 152 L86 112 L140 108 L156 150 M100 152 L140 108 M140 108 L136 90 L150 86" fill="none" stroke="#E1251B" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
   <path d="M88 108 L124 70" stroke="currentColor" stroke-width="20" stroke-linecap="round"/>
   <path d="M122 74 L140 90" stroke="currentColor" stroke-width="9" stroke-linecap="round"/>
   <path d="M92 110 L112 128 L104 150" fill="none" stroke="currentColor" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
   <circle cx="138" cy="52" r="19" fill="currentColor"/>
   <path d="M136 47 H160 L156 58 H138Z" fill="#E1251B"/>
   <path d="M120 44 C108 38 96 40 86 48 M122 54 C110 52 100 56 92 64" fill="none" stroke="#C47A3E" stroke-width="5" stroke-linecap="round"/>
  </g>
  <!-- B: arquero, la C como arco -->
  <g id="arco">
   <path d="M150 34 A80 80 0 1 0 150 186" fill="none" stroke="currentColor" stroke-width="26" stroke-linecap="round"/>
   <path d="M150 34 L112 110 L150 186" fill="none" stroke="currentColor" stroke-width="3" opacity=".7"/>
   <path d="M60 110 H188" stroke="#E1251B" stroke-width="9" stroke-linecap="round"/>
   <path d="M196 110 L176 96 L180 110 L176 124Z" fill="#E1251B"/>
   <path d="M60 110 L48 100 M60 110 L48 120 M70 110 L58 100 M70 110 L58 120" stroke="#C47A3E" stroke-width="5" stroke-linecap="round"/>
  </g>
 </defs>
</svg>

<!-- Opción A -->
<div class="row">
 <div class="cell d"><span class="tag">A · El Centauro</span>
  <svg width="760" height="300" viewBox="0 0 760 300" style="color:#F6F4EF">
   <use href="#centauro" transform="translate(30 40) scale(1.1) skewX(-10)"/>
   <text x="268" y="168" font-family="Barlow Condensed" font-style="italic" font-weight="900" font-size="100" fill="#F6F4EF">CENTAUROS</text>
   <rect x="272" y="190" width="56" height="8" fill="#E1251B"/>
   <text x="340" y="210" font-family="Barlow Condensed" font-style="italic" font-weight="800" font-size="40" letter-spacing="6" fill="#C47A3E">BMX RACE</text>
  </svg></div>
 <div class="cell l"><span class="tag">A · versión clara</span>
  <svg width="760" height="300" viewBox="0 0 760 300" style="color:#151618">
   <use href="#centauro" transform="translate(30 40) scale(1.1) skewX(-10)"/>
   <text x="268" y="168" font-family="Barlow Condensed" font-style="italic" font-weight="900" font-size="100" fill="#151618">CENTAUROS</text>
   <rect x="272" y="190" width="56" height="8" fill="#E1251B"/>
   <text x="340" y="210" font-family="Barlow Condensed" font-style="italic" font-weight="800" font-size="40" letter-spacing="6" fill="#8E5226">BMX RACE</text>
  </svg></div>
</div>

<!-- Opción B -->
<div class="row">
 <div class="cell d"><span class="tag">B · El Arquero</span>
  <svg width="760" height="300" viewBox="0 0 760 300" style="color:#F6F4EF">
   <use href="#arco" transform="translate(20 40)"/>
   <text x="250" y="160" font-family="Barlow Condensed" font-style="italic" font-weight="900" font-size="100" fill="#F6F4EF">CENTAUROS</text>
   <text x="254" y="206" font-family="Barlow Condensed" font-style="italic" font-weight="800" font-size="40" letter-spacing="6" fill="#E1251B">BMX RACE · CHIHUAHUA</text>
  </svg></div>
 <div class="cell l"><span class="tag">B · versión clara</span>
  <svg width="760" height="300" viewBox="0 0 760 300" style="color:#151618">
   <use href="#arco" transform="translate(20 40)"/>
   <text x="250" y="160" font-family="Barlow Condensed" font-style="italic" font-weight="900" font-size="100" fill="#151618">CENTAUROS</text>
   <text x="254" y="206" font-family="Barlow Condensed" font-style="italic" font-weight="800" font-size="40" letter-spacing="6" fill="#E1251B">BMX RACE · CHIHUAHUA</text>
  </svg></div>
</div>

<!-- Opción C -->
<div class="row">
 <div class="cell d"><span class="tag">C · La Placa (jersey y escudo)</span>
  <svg width="420" height="420" viewBox="0 0 420 420">
   <path d="M40 120 Q40 40 120 40 H300 Q380 40 380 120 V350 Q380 380 350 380 H70 Q40 380 40 350Z" fill="#F6F4EF"/>
   <circle cx="90" cy="88" r="9" fill="#bdb8ae"/><circle cx="330" cy="88" r="9" fill="#bdb8ae"/>
   <g transform="translate(110 70) scale(.95)" style="color:#151618"><use href="#centauro"/></g>
   <rect x="40" y="272" width="340" height="54" fill="#151618"/>
   <text x="210" y="312" text-anchor="middle" font-family="Barlow Condensed" font-style="italic" font-weight="900" font-size="46" fill="#F6F4EF" letter-spacing="2">CENTAUROS</text>
   <text x="210" y="362" text-anchor="middle" font-family="Barlow Condensed" font-style="italic" font-weight="800" font-size="28" letter-spacing="8" fill="#E1251B">BMX RACE</text>
  </svg></div>
 <div class="cell l"><span class="tag">C · ícono para redes</span>
  <svg width="320" height="320" viewBox="0 0 320 320">
   <rect width="320" height="320" rx="64" fill="#151618"/>
   <g transform="translate(40 50) scale(1.15)" style="color:#F6F4EF"><use href="#centauro"/></g>
   <text x="160" y="290" text-anchor="middle" font-family="Barlow Condensed" font-style="italic" font-weight="900" font-size="38" letter-spacing="3" fill="#F6F4EF">CENTAUROS</text>
  </svg></div>
</div>
</body></html>
